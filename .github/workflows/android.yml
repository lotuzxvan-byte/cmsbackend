name: Android debug build
on:
  push:
    branches: [feature/android-mobile]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle -p android :app:assembleDebug :app:lintDebug
      - name: Enable emulator acceleration on CI runner
        run: sudo chmod a+rw /dev/kvm
      - name: Android launch regression check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/test-launch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sampoerna-android-0.2.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
